name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Check access code secret
        env:
          SITE_ACCESS_CODE: ${{ secrets.SITE_ACCESS_CODE }}
        run: |
          if [ -z "$SITE_ACCESS_CODE" ]; then
            echo "::error::SITE_ACCESS_CODE 시크릿이 없습니다. 저장소 Settings → Secrets and variables → Actions 에서 입장 코드를 등록하세요."
            exit 1
          fi

      - name: Build
        env:
          SITE_ACCESS_CODE: ${{ secrets.SITE_ACCESS_CODE }}
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
