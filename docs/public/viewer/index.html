<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실험실용 CIP 3D 뷰어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D stage, spec card top-left, part tree right, view bar bottom-center */
:root {
  --bg: #e9ecef;
  --bg-deep: #d5dade;
  --surface: rgba(255, 255, 255, 0.86);
  --ink: #1f2429;
  --ink-soft: #5d656d;
  --line: #c9cfd5;
  --accent: #0b5cad;
  --accent-soft: #e2edf8;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(ellipse at 50% 35%, #f6f7f9 0%, var(--bg) 55%, var(--bg-deep) 100%);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  overflow: hidden;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; outline: none; }

.panel {
  position: absolute;
  background: var(--surface);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 6px 24px rgba(30, 40, 50, 0.08);
}

#spec { top: 16px; left: 16px; padding: 14px 16px; max-width: 320px; display: grid; gap: 8px; }
#spec .model { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); letter-spacing: 0.02em; }
#spec h1 { margin: 0; font-size: 18px; font-weight: 700; text-wrap: balance; }
#spec .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums;
  padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent);
}
#spec .dims { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

#side { top: 16px; right: 16px; width: 270px; max-height: calc(100% - 110px); display: flex; flex-direction: column; overflow: hidden; }
#side h2 { margin: 0; padding: 12px 14px 8px; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
#groups { list-style: none; margin: 0; padding: 0 8px 8px; overflow-y: auto; display: grid; gap: 2px; }
#groups label {
  display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 6px; cursor: pointer;
}
#groups label:hover { background: rgba(11, 92, 173, 0.06); }
#groups input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
#groups .n { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); }

#info { border-top: 1px solid var(--line); padding: 12px 14px 14px; display: grid; gap: 4px; }
#info .k { font-size: 11px; color: var(--ink-soft); }
#info .name { font-weight: 700; font-size: 14px; }
#info .pn { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); word-break: break-all; }
#info .grp { font-size: 12px; color: var(--accent); }
#info .hint { font-size: 12px; color: var(--ink-soft); }

#bar { left: 50%; bottom: 16px; transform: translateX(-50%); padding: 6px; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: calc(100% - 32px); }
#bar button {
  font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 0;
  padding: 8px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap;
}
#bar button:hover { background: rgba(11, 92, 173, 0.08); }
#bar button[aria-pressed="true"] { background: var(--accent); color: #fff; }
#bar .mm { font-family: var(--font-mono); font-size: 11px; font-variant-numeric: tabular-nums; opacity: 0.75; margin-left: 4px; display: inline-block; min-width: 92px; text-align: left; margin-left: 6px; }
#bar .sep { width: 1px; background: var(--line); margin: 6px 4px; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#loading {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
  font-size: 13px; color: var(--ink-soft);
}
#loading .track { width: 220px; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 10px; }
#loading .fill { height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }

/* embed mode (#embed): compact for manual pages — no spec card or part list, link to full viewer */
#full { display: none; text-decoration: none; white-space: nowrap; }
body.embed #bar { align-items: center; }
body.embed #spec, body.embed #side h2, body.embed #groups { display: none; }
body.embed #side { width: 230px; top: 12px; right: 12px; }
body.embed #info { border-top: 0; }
body.embed #full { display: inline-flex; align-items: center; }
body.embed #bar { bottom: 10px; padding: 4px; gap: 2px; flex-wrap: nowrap; }
body.embed #bar button, body.embed #full { padding: 7px 8px; font-size: 12.5px; }
body.embed #spin, body.embed #bar .sep { display: none; }
body.embed #bar .mm { min-width: 0; }
@media (max-width: 760px) {
  body.embed #side { top: 12px; bottom: auto; left: auto; right: 12px; width: 200px; max-height: none; }
  #side { top: auto; bottom: 76px; right: 16px; left: 16px; width: auto; max-height: 34%; }
  #spec { right: 16px; max-width: none; }
  #groups { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) { #loading .fill { transition: none; } }
</style>
<script type="importmap">

<body>
<div id="stage" aria-label="3D 모델 화면. 드래그로 회전, 휠로 확대, 우클릭 드래그로 이동"></div>

<section id="spec" class="panel">
  <div class="model">WIP26021-00A-00-000-0</div>
  <h1>실험실용 CIP</h1>
  <div class="chips">
    <span class="chip">Φ70 × 200L</span>
    <span class="chip">85 ℃</span>
    <span class="chip">6,000 bar</span>
  </div>
  <div class="dims">외형 1,746 × 750 × 1,109.5 mm (L × W × H)</div>
</section>

<aside id="side" class="panel">
  <h2>구성 부품</h2>
  <ul id="groups"></ul>
  <div id="info" aria-live="polite">
    <div class="hint">부품을 클릭하면 이름과 도면 번호가 표시됩니다.</div>
  </div>
</aside>

<nav id="bar" class="panel" aria-label="보기 설정">
  <button data-view="iso" aria-pressed="true">투시</button>
  <button data-view="front" aria-pressed="false">정면</button>
  <button data-view="side" aria-pressed="false">측면</button>
  <button data-view="back" aria-pressed="false">후면</button>
  <button data-view="top" aria-pressed="false">상면</button>
  <span class="sep" aria-hidden="true"></span>
  <button id="lift" aria-pressed="false">커버 열기 <span class="mm" id="liftmm">닫힘</span></button>
  <button id="xray" aria-pressed="false">커버 투명</button>
  <button id="spin" aria-pressed="false">자동 회전</button>
  <a id="full" href="./index.html" target="_blank" rel="noopener" style="font-size:13px;color:var(--accent);padding:8px 12px;border-radius:6px">전체 화면 ↗</a>
</nav>

<div id="loading"><div><div id="loadtxt">3D 모델 불러오는 중…</div><div class="track"><div class="fill" id="loadfill"></div></div></div></div>

<script>
  if (location.hash.includes('embed')) document.body.classList.add('embed');
  // Same customer access gate as the manual site (docs/.vitepress/access-gate.ts): only on the deployed site.
  (function () {
    var ok = false;
    try { ok = !!localStorage.getItem('cip_access_v1'); } catch (e) {}
    if (!ok && /github\.io$/.test(location.hostname)) {
      document.body.innerHTML = '<div style="position:fixed;inset:0;display:grid;place-items:center;font:15px/1.6 sans-serif;color:#5d656d;text-align:center;padding:24px">'
        + '고객 전용 자료입니다.<br><a href="/CIP/" target="_top" style="color:#0b5cad;font-weight:600">기술자료 사이트에서 접속 코드를 입력</a>한 뒤 이용해 주세요.</div>';
      window.__cipLocked = true;
    }
  })();
</script>
<script type="module">
if (window.__cipLocked) throw new Error('locked');
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const MODEL_URL = './model/wip26021.glb';

// Friendly names for parts a manual reader is likely to click
const LABELS = [
  [/^WIP26021-04A-05-002/, '조작 패널 전면판'],
  [/^WIP26021-04A-05-004/, '전면 커버'],
  [/^WIP26021-04A-06-00/, '컨트롤러 박스'],
  [/^P-TOPRW/, '터치 패널 (HMI)'],
  [/^P-KGE-J4R1R/, '비상 정지 스위치'],
  [/^P-J2M1A/, '키 스위치'],
  [/^P-JD2B/, '푸시 버튼'],
  [/^P-GD120F/, '캐스터'],
  [/^WIP26021-00A-00-001/, '장비 명판'],
  [/^WIP26021-04A-01-001/, '상판 (전면)'],
  [/^WIP26021-04A-07-001/, '상판 (후면)'],
  [/^WIP26021-04A-00-01[5-8]/, '측면 커버'],
  [/^WIP26021-04A-00-019/, '후면 커버'],
  [/^WIP26021-04A-00-001/, '베이스 프레임'],
  [/^WIP26021-04A-09-001/, '안전핀 (Pin)'],
  [/^WIP26021-04A-0(9|10)/, '핀 구동 브래킷'],
  [/^MY3B40\(0\)_TABLE/, 'Air Cylinder for Pin IN/OUT · 테이블'],
  [/^MY3B40/, 'Air Cylinder for Pin IN/OUT (핀 실린더)'],
  [/^(MY3_D-A93|BMY3)/, 'Pin In/Out Limit Switch'],
  [/^P-LT-101/, '케이블 그로밋'],
  [/^P-PP-200/, '손잡이'],
  [/^P-FST800/, '압력 센서'],
  [/^TCDA2B40-50025/, 'Air Cylinder for Cover UP/DOWN (커버 승강 실린더)'],
  [/^TCDA2B40-500-500Rod/, '커버 승강 실린더 로드'],
  [/^WIP26021-05A-00-010/, '커버 승강 크로스바'],
  [/^WIP26021-05A-00-001/, 'Pressure Vessel (Cover) · 압력용기 커버'],
  [/^WIP26021-05A-00-011/, '커버 센터 로드'],
  [/^WIP26021-05A-00-012/, '커버 상부 캡'],
  [/^WIP26021-05A-00-013/, '커버 승강 실린더 브래킷'],
  [/^40Auto Switch/, 'Cover Up/Down 감지 센서'],
  [/^WIP26021-01A-00-001/, 'Pressure Vessel (Body) · 압력용기 본체'],
  [/^HP /, '고압 부품'],
  [/^P-(SHCS|HHB|BHCS|FHCS)/, '볼트'],
  [/^P-(PW|SW)-/, '와셔'],
  [/^P-HN-/, '너트'],
  [/^명판_/, '배관 명판'],
];
const cleanName = (s) => s.replace(/#\d+$/, '').replace(/#?_?표준.*$/, '').replace(/#$/, '').replace(/_KS .*$/, '').replace(/_JIS .*$/, '');
const labelFor = (pn) => { for (const [re, l] of LABELS) if (re.test(pn)) return l; return null; };

// ---------- renderer / scene ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(stage.clientWidth, stage.clientHeight);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.65;

const camera = new THREE.PerspectiveCamera(32, stage.clientWidth / stage.clientHeight, 0.01, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.495;
controls.autoRotateSpeed = 0.8;

const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0002;
key.shadow.normalBias = 0.012;
key.shadow.radius = 6;
scene.add(key, key.target);
scene.add(new THREE.HemisphereLight(0xffffff, 0xc9ced3, 0.5));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.16 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- model ----------
const draco = new DRACOLoader().setDecoderPath('./lib/draco/');
const loader = new GLTFLoader().setDRACOLoader(draco);
const fill = document.getElementById('loadfill');
const pickables = [];
const groups = new Map();      // group name -> [Object3D]
let center = new THREE.Vector3(), radius = 1;
const coverMats = new Set();

// Loads model/wip26021.glb; falls back to the base64 copy (model/wip26021.glb.js) on hosts that cannot serve .glb
async function loadModelBuffer() {
  try {
    const r = await fetch(MODEL_URL);
    if (r.ok) {
      const total = +r.headers.get('content-length') || 0;
      if (!total || !r.body) return await r.arrayBuffer();
      const reader = r.body.getReader(); const chunks = []; let got = 0;
      for (;;) { const { done, value } = await reader.read(); if (done) break; chunks.push(value); got += value.length; fill.style.width = (100 * got / total).toFixed(0) + '%'; }
      const out = new Uint8Array(got); let o = 0; for (const c of chunks) { out.set(c, o); o += c.length; }
      return out.buffer;
    }
  } catch (e) { /* fall through */ }
  const mod = await import('./model/wip26021.glb.js');
  fill.style.width = '100%';
  const bin = atob(mod.default); const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out.buffer;
}
loadModelBuffer().then((buf) => loader.parseAsync(buf, './model/')).then((gltf) => {
  const root = gltf.scene;
  // sit on the floor, centered
  const box = new THREE.Box3().setFromObject(root);
  root.position.sub(new THREE.Vector3((box.min.x + box.max.x) / 2, box.min.y, (box.min.z + box.max.z) / 2));
  scene.add(root);
  root.updateMatrixWorld(true);
  const b2 = new THREE.Box3().setFromObject(root);
  b2.getCenter(center);
  radius = b2.getSize(new THREE.Vector3()).length() / 2 * 1.08;
  center.y += 0.12;

  root.traverse((o) => {
    if (o.isMesh) {
      o.castShadow = true; o.receiveShadow = true;
      pickables.push(o);
      const m = o.material;
      if (m && m.name === '도장_라이트그레이') coverMats.add(m);
    }
    if (o.userData && o.userData.group && o.userData.part) {
      if (!groups.has(o.userData.group)) groups.set(o.userData.group, []);
      groups.get(o.userData.group).push(o);
    }
  });

  key.position.set(center.x + radius * 1.2, center.y + radius * 2.2, center.z + radius * 1.6);
  key.target.position.copy(center);
  const s = radius * 1.4;
  Object.assign(key.shadow.camera, { left: -s, right: s, top: s, bottom: -s, near: 0.1, far: radius * 6 });
  key.shadow.camera.updateProjectionMatrix();

  buildGroupList();
  setupLift(root);
  const h = location.hash.replace('#', '').split('-');      // e.g. #xray-side, #open
  setView(h.find((x) => VIEWS[x]) || 'iso', false);
  if (h.includes('xray')) document.getElementById('xray').click();
  if (h.includes('open')) document.getElementById('lift').click();
  document.getElementById('loading').remove();
}).catch(() => {
  document.getElementById('loadtxt').textContent = '모델 파일을 불러오지 못했습니다. model 폴더의 파일 경로를 확인해 주세요.';
});

// ---------- group list ----------
const GROUP_LABEL = {
  '리프트 시스템 (05A)': '커버 승강부 (05A)',
  '미니 인텐시파이어 펌프': 'High Pressure Pump',
  '리저버 탱크 (03A)': 'Water Tank (03A)',
};
function buildGroupList() {
  const order = ['메인 프레임 (04A)', '베셀 조립체 (01A)', '리프트 시스템 (05A)', '미니 인텐시파이어 펌프', '리저버 탱크 (03A)', '고압 배관 (98A)', '체결 부품·기타'];
  const ul = document.getElementById('groups');
  [...groups.keys()].sort((a, b) => order.indexOf(a) - order.indexOf(b)).forEach((g, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<label for="g${i}"><input type="checkbox" id="g${i}" checked><span></span><span class="n"></span></label>`;
    li.querySelector('span').textContent = GROUP_LABEL[g] || g;
    li.querySelector('.n').textContent = groups.get(g).length;
    li.querySelector('input').addEventListener('change', (ev) => {
      groups.get(g).forEach((o) => { o.visible = ev.target.checked; });
    });
    ul.appendChild(li);
  });
}

// ---------- open / close sequence ----------
// Manual 5.4 interlock, reversed for opening.
// Open : ① Pin OUT  — Air Cylinder for Pin IN/OUT (MY3B40-300) pulls pin 04A-09-001 300 mm rearward
//        ② Cover UP — Air Cylinder for Cover UP/DOWN (TCDA2B40 ×2, stroke 500) raises the cover 500 mm
// Close: ② Cover DOWN first, then ① Pin IN.
const SLIDE_STROKE = 0.3, LIFT_STROKE = 0.5;               // m
const SLIDE_SEC = 2.0, LIFT_SEC = 3.0;
const FIXED_LIFT_PARTS = /^(TCDA2B40-50025|40Auto Switch|WIP26021-05A-00-013)/;
const SLIDE_PARTS = /^(WIP26021-04A-09-00[12]|WIP26021-04A-10-|MY3B40\(0\)_TABLE|P-JAF40|P-HHB-SNCM-M14|P-(PW|SW)-SNCM-M(14|8)|P-SHCS-SNCM-M8X110|P-SHCS-SUS-M6X12)/;
const liftMovers = [], slideMovers = [];
const seq = { slide: 0, lift: 0, open: false };
function mover(n, worldDelta) {
  const w0 = n.getWorldPosition(new THREE.Vector3());
  return { n, p0: n.position.clone(), p1: n.parent.worldToLocal(w0.add(worldDelta)) };
}
function setupLift(root) {
  (groups.get('리프트 시스템 (05A)') || []).forEach((n) => {
    if (!FIXED_LIFT_PARTS.test(n.userData.part)) liftMovers.push(mover(n, new THREE.Vector3(0, LIFT_STROKE, 0)));
  });
  const unit = root.getObjectByName('NAUO370');                // slide unit sub-assembly
  if (unit) unit.traverse((n) => {
    if (n !== unit && n.userData && n.userData.part && SLIDE_PARTS.test(n.userData.part))
      slideMovers.push(mover(n, new THREE.Vector3(0, 0, -SLIDE_STROKE)));   // toward the rear
  });
}
const ease = (k) => k * k * (3 - 2 * k);
function applySeq() {
  const ks = ease(seq.slide), kl = ease(seq.lift);
  slideMovers.forEach(({ n, p0, p1 }) => n.position.lerpVectors(p0, p1, ks));
  liftMovers.forEach(({ n, p0, p1 }) => n.position.lerpVectors(p0, p1, kl));
  const mm = document.getElementById('liftmm');
  if (seq.lift > 0) mm.textContent = '커버 상승 ' + Math.round(kl * LIFT_STROKE * 1000) + ' mm';
  else if (seq.slide > 0) mm.textContent = '핀 인출 ' + Math.round(ks * SLIDE_STROKE * 1000) + ' mm';
  else mm.textContent = '닫힘';
}
function stepSeq(dt) {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ds = reduce ? 1 : dt / SLIDE_SEC, dl = reduce ? 1 : dt / LIFT_SEC;
  const before = seq.slide + seq.lift;
  if (seq.open) {
    if (seq.slide < 1) seq.slide = Math.min(1, seq.slide + ds);          // ① block out
    else if (seq.lift < 1) seq.lift = Math.min(1, seq.lift + dl);        // ② then lift
  } else {
    if (seq.lift > 0) seq.lift = Math.max(0, seq.lift - dl);             // ② lower first
    else if (seq.slide > 0) seq.slide = Math.max(0, seq.slide - ds);     // ① then block in
  }
  if (seq.slide + seq.lift !== before) applySeq();
}
document.getElementById('lift').addEventListener('click', (e) => {
  const b = e.currentTarget;
  seq.open = !seq.open;
  b.setAttribute('aria-pressed', String(seq.open));
  b.firstChild.textContent = seq.open ? '커버 닫기 ' : '커버 열기 ';
});

// ---------- views ----------
const VIEWS = {
  iso:   [1.0, 0.62, 1.15],
  front: [0, 0.18, 1],
  side:  [1, 0.18, 0],
  back:  [-0.35, 0.3, -1],
  top:   [0.0001, 1, 0.0002],
};
let anim = null;
function setView(name, smooth = true) {
  const dir = new THREE.Vector3(...VIEWS[name]).normalize();
  const fov = THREE.MathUtils.degToRad(camera.fov);
  const dist = radius / Math.sin(fov / 2) * (camera.aspect < 1 ? 1.35 / camera.aspect : 1.05);
  const toPos = center.clone().addScaledVector(dir, dist);
  const toTarget = center.clone();
  document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === name)));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!smooth || reduce) { camera.position.copy(toPos); controls.target.copy(toTarget); controls.update(); return; }
  anim = { t: 0, p0: camera.position.clone(), t0: controls.target.clone(), p1: toPos, t1: toTarget };
}
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));

document.getElementById('spin').addEventListener('click', (e) => {
  controls.autoRotate = !controls.autoRotate;
  e.currentTarget.setAttribute('aria-pressed', String(controls.autoRotate));
});
document.getElementById('xray').addEventListener('click', (e) => {
  const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
  e.currentTarget.setAttribute('aria-pressed', String(on));
  coverMats.forEach((m) => { m.transparent = on; m.opacity = on ? 0.14 : 1; m.depthWrite = !on; m.needsUpdate = true; });
});

// ---------- picking ----------
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
let selected = null, downAt = null;
const hiMats = new Map();
function partOf(o) { while (o && !(o.userData && o.userData.part)) o = o.parent; return o; }
function meshesOf(node) { const a = []; node.traverse((m) => { if (m.isMesh) a.push(m); }); return a; }
function highlight(node, on) {
  meshesOf(node).forEach((m) => {
    if (on) {
      m.userData._mat = m.material;
      let h = hiMats.get(m.material);
      if (!h) { h = m.material.clone(); h.emissive = new THREE.Color(0x0b5cad); h.emissiveIntensity = 0.55; hiMats.set(m.material, h); }
      m.material = h;
    } else if (m.userData._mat) { m.material = m.userData._mat; delete m.userData._mat; }
  });
}
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(pickables, false).filter((h) => {
    let o = h.object; while (o) { if (!o.visible) return false; o = o.parent; }
    const m = h.object.userData._mat || h.object.material;
    return !(m.transparent && m.opacity < 0.5);
  });
  return hits.length ? partOf(hits[0].object) : null;
}
renderer.domElement.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 4) return;
  const node = pick(e);
  if (selected) highlight(selected, false);
  selected = node && node !== selected ? node : null;
  if (selected) highlight(selected, true);
  showInfo(selected);
});
function showInfo(node) {
  const box = document.getElementById('info');
  if (!node) { box.innerHTML = '<div class="hint">부품을 클릭하면 이름과 도면 번호가 표시됩니다.</div>'; return; }
  const pn = cleanName(node.userData.part);
  const label = labelFor(node.userData.part);
  box.innerHTML = '<div class="k">선택한 부품</div><div class="name"></div><div class="pn"></div><div class="grp"></div>';
  box.querySelector('.name').textContent = label || pn;
  box.querySelector('.pn').textContent = label ? pn : '';
  box.querySelector('.grp').textContent = GROUP_LABEL[node.userData.group] || node.userData.group;
}

// ---------- loop ----------
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (anim) {
    anim.t = Math.min(1, anim.t + dt / 0.7);
    const k = 1 - Math.pow(1 - anim.t, 3);
    camera.position.lerpVectors(anim.p0, anim.p1, k);
    controls.target.lerpVectors(anim.t0, anim.t1, k);
    if (anim.t >= 1) anim = null;
  }
  stepSeq(dt);
  controls.update();
  renderer.render(scene, camera);
});
controls.addEventListener('start', () => { anim = null; document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', 'false')); });
</script>
</body>
</html>
