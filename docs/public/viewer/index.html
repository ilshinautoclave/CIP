<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pin type CIP 3D 뷰어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D stage, spec card top-left, part tree right, view bar bottom-center */
:root {
  --bg: #e9ecef;
  --bg-deep: #d5dade;
  --surface: rgba(255, 255, 255, 0.86);
  --ink: #1f2429;
  --ink-soft: #5d656d;
  --line: #c9cfd5;
  --accent: #0b5cad;
  --accent-soft: #e2edf8;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(ellipse at 50% 35%, #f6f7f9 0%, var(--bg) 55%, var(--bg-deep) 100%);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  overflow: hidden;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; outline: none; }

.panel {
  position: absolute;
  background: var(--surface);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 6px 24px rgba(30, 40, 50, 0.08);
}

#spec { top: 16px; left: 16px; padding: 14px 16px; max-width: 320px; display: grid; gap: 8px; }
#spec .model { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); letter-spacing: 0.02em; }
#spec h1 { margin: 0; font-size: 18px; font-weight: 700; text-wrap: balance; }
#spec .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums;
  padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent);
}
#spec .dims { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

#side { top: 16px; right: 16px; width: 220px; max-height: calc(100% - 110px); display: flex; flex-direction: column; overflow: hidden; }
#side h2 { margin: 0; padding: 12px 14px 8px; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
#groups { list-style: none; margin: 0; padding: 0 8px 8px; overflow-y: auto; display: grid; gap: 2px; }
#groups label {
  display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 6px; cursor: pointer;
}
#groups label:hover { background: rgba(11, 92, 173, 0.06); }
#groups input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; flex: none; }
#groups li { display: flex; align-items: center; gap: 4px; padding-left: 8px; border-radius: 6px; }
#groups li:hover { background: rgba(11, 92, 173, 0.06); }
#groups .gname {
  flex: 1; text-align: left; font: inherit; color: var(--ink); background: transparent; border: 0;
  padding: 7px 8px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px;
}
#groups .gname::after { content: ""; width: 8px; height: 8px; border-radius: 50%; margin-left: auto; background: transparent; }
#groups .gname[aria-pressed="true"] { color: var(--accent); font-weight: 700; }
#groups .gname[aria-pressed="true"]::after { background: #2b8cff; box-shadow: 0 0 8px #2b8cff; }
#side .hint { margin: 0; padding: 0 14px 12px; font-size: 11.5px; color: var(--ink-soft); }


#bar { left: 50%; bottom: 16px; transform: translateX(-50%); padding: 6px; display: flex; flex-direction: column; gap: 2px; max-width: calc(100% - 32px); }
#bar .row { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px; }
#bar .row + .row { border-top: 1px solid var(--line); padding-top: 4px; }
#bar .row-label { font-size: 12px; color: var(--ink-soft); padding: 0 6px 0 4px; }
#bar #play { font-weight: 700; color: var(--accent); }
#bar #play[aria-pressed="true"] { color: #fff; }
#bar button:disabled { opacity: 0.4; cursor: default; }
#full { color: var(--accent); font-size: 13px; padding: 8px 12px; border-radius: 6px; }
#bar button {
  font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 0;
  padding: 8px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap;
}
#bar button:hover { background: rgba(11, 92, 173, 0.08); }
#bar button[aria-pressed="true"] { background: var(--accent); color: #fff; }
#bar .mm { font-family: var(--font-mono); font-size: 11px; font-variant-numeric: tabular-nums; opacity: 0.75; margin-left: 4px; display: inline-block; min-width: 92px; text-align: left; margin-left: 6px; }
#bar .sep { width: 1px; background: var(--line); margin: 6px 4px; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#loading {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
  font-size: 13px; color: var(--ink-soft);
}
#loading .track { width: 220px; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 10px; }
#loading .fill { height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }

/* embed mode (#embed): compact for manual pages — no spec card or part list, link to full viewer */
#full { display: none; text-decoration: none; white-space: nowrap; }
body.embed #spec, body.embed #side { display: none; }
body.embed body.embed #full { display: inline-flex; align-items: center; }
body.embed #bar { bottom: 10px; padding: 4px; gap: 2px; }
body.embed #bar button, body.embed #full { padding: 7px 8px; font-size: 12.5px; }
body.embed #spin, body.embed #bar .sep { display: none; }
body.embed #bar .mm { min-width: 0; }
@media (max-width: 760px) {
  #side { top: auto; bottom: 76px; right: 16px; left: 16px; width: auto; max-height: 34%; }
  #spec { right: 16px; max-width: none; }
  #groups { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) { #loading .fill { transition: none; } }
</style>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js", "three/addons/": "./lib/addons/" } }
</script>
</head>
<body>
<div id="stage" aria-label="3D 모델 화면. 드래그로 회전, 휠로 확대, 우클릭 드래그로 이동"></div>

<section id="spec" class="panel">
  <h1>Pin type CIP</h1>
</section>

<aside id="side" class="panel">
  <h2>구성 보기</h2>
  <ul id="groups"></ul>
  <p class="hint">이름을 누르면 해당 부분이 표시됩니다.</p>
</aside>

<nav id="bar" class="panel" aria-label="보기 설정">
  <div class="row">
    <button id="play" aria-pressed="false">모션 재생</button>
    <button id="lift" aria-pressed="false">커버 열기 <span class="mm" id="liftmm">닫힘</span></button>
    <button id="xray" aria-pressed="false">커버 투명</button>
    <button id="spin" aria-pressed="false">자동 회전</button>
    <a id="full" href="./index.html" target="_blank" rel="noopener">전체 화면 ↗</a>
  </div>
  <div class="row">
    <span class="row-label">뷰</span>
    <button data-view="iso" aria-pressed="true">투시</button>
    <button data-view="front" aria-pressed="false">정면</button>
    <button data-view="side" aria-pressed="false">측면</button>
    <button data-view="back" aria-pressed="false">후면</button>
    <button data-view="top" aria-pressed="false">상면</button>
  </div>
</nav>

<div id="loading"><div><div id="loadtxt">3D 모델 불러오는 중…</div><div class="track"><div class="fill" id="loadfill"></div></div></div></div>

<script>
  if (location.hash.includes('embed')) document.body.classList.add('embed');
  // Same customer access gate as the manual site (docs/.vitepress/access-gate.ts): only on the deployed site.
  (function () {
    var ok = false;
    try { ok = !!localStorage.getItem('cip_access_v1'); } catch (e) {}
    if (!ok && /github\.io$/.test(location.hostname)) {
      document.body.innerHTML = '<div style="position:fixed;inset:0;display:grid;place-items:center;font:15px/1.6 sans-serif;color:#5d656d;text-align:center;padding:24px">'
        + '고객 전용 자료입니다.<br><a href="/CIP/" target="_top" style="color:#0b5cad;font-weight:600">기술자료 사이트에서 접속 코드를 입력</a>한 뒤 이용해 주세요.</div>';
      window.__cipLocked = true;
    }
  })();
</script>
<script type="module">
if (window.__cipLocked) throw new Error('locked');
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const MODEL_URL = './model/wip26021.glb';

// ---------- renderer / scene ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(stage.clientWidth, stage.clientHeight);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.65;

const camera = new THREE.PerspectiveCamera(32, stage.clientWidth / stage.clientHeight, 0.01, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.495;
controls.autoRotateSpeed = 0.8;

const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0002;
key.shadow.normalBias = 0.012;
key.shadow.radius = 6;
scene.add(key, key.target);
scene.add(new THREE.HemisphereLight(0xffffff, 0xc9ced3, 0.5));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.16 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- model ----------
const draco = new DRACOLoader().setDecoderPath('./lib/draco/');
const loader = new GLTFLoader().setDRACOLoader(draco);
const fill = document.getElementById('loadfill');
const groups = new Map();      // group name -> [Object3D]
let center = new THREE.Vector3(), radius = 1;
const coverMats = new Set();

// Loads model/wip26021.glb; falls back to the base64 copy (model/wip26021.glb.js) on hosts that cannot serve .glb
async function loadModelBuffer() {
  try {
    const r = await fetch(MODEL_URL);
    if (r.ok) {
      const total = +r.headers.get('content-length') || 0;
      if (!total || !r.body) return await r.arrayBuffer();
      const reader = r.body.getReader(); const chunks = []; let got = 0;
      for (;;) { const { done, value } = await reader.read(); if (done) break; chunks.push(value); got += value.length; fill.style.width = (100 * got / total).toFixed(0) + '%'; }
      const out = new Uint8Array(got); let o = 0; for (const c of chunks) { out.set(c, o); o += c.length; }
      return out.buffer;
    }
  } catch (e) { /* fall through */ }
  const mod = await import('./model/wip26021.glb.js');
  fill.style.width = '100%';
  const bin = atob(mod.default); const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out.buffer;
}
loadModelBuffer().then((buf) => loader.parseAsync(buf, './model/')).then((gltf) => {
  const root = gltf.scene;
  // sit on the floor, centered
  const box = new THREE.Box3().setFromObject(root);
  root.position.sub(new THREE.Vector3((box.min.x + box.max.x) / 2, box.min.y, (box.min.z + box.max.z) / 2));
  scene.add(root);
  root.updateMatrixWorld(true);
  const b2 = new THREE.Box3().setFromObject(root);
  b2.getCenter(center);
  radius = b2.getSize(new THREE.Vector3()).length() / 2 * 1.08;
  center.y += 0.12;

  root.traverse((o) => {
    if (o.isMesh) {
      o.castShadow = true; o.receiveShadow = true;
      const m = o.material;
      if (m && m.name === '도장_라이트그레이') coverMats.add(m);
    }
    if (o.userData && o.userData.group) {
      if (!groups.has(o.userData.group)) groups.set(o.userData.group, []);
      groups.get(o.userData.group).push(o);
    }
  });

  key.position.set(center.x + radius * 1.2, center.y + radius * 2.2, center.z + radius * 1.6);
  key.target.position.copy(center);
  const s = radius * 1.4;
  Object.assign(key.shadow.camera, { left: -s, right: s, top: s, bottom: -s, near: 0.1, far: radius * 6 });
  key.shadow.camera.updateProjectionMatrix();

  buildGroupList();
  setupLift(root);
  const h = location.hash.replace('#', '').split('-');      // e.g. #xray-side, #open
  setView(h.find((x) => VIEWS[x]) || 'iso', false);
  if (h.includes('xray')) document.getElementById('xray').click();
  if (h.includes('open')) setOpen(true);
  if (h.includes('play')) startMotion();
  document.getElementById('loading').remove();
}).catch(() => {
  document.getElementById('loadtxt').textContent = '모델 파일을 불러오지 못했습니다. model 폴더의 파일 경로를 확인해 주세요.';
});

// ---------- group list ----------
const SHOWN_GROUPS = ['베셀 조립체', '커버 승강부', 'High Pressure Pump', 'Water Tank'];
function buildGroupList() {
  const ul = document.getElementById('groups');
  SHOWN_GROUPS.filter((g) => groups.has(g)).forEach((g, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<input type="checkbox" id="g${i}" checked aria-label="보이기"><button type="button" class="gname" aria-pressed="false"></button>`;
    const btn = li.querySelector('.gname');
    btn.textContent = g;
    li.querySelector('input').addEventListener('change', (ev) => {
      groups.get(g).forEach((o) => { o.visible = ev.target.checked; });
    });
    btn.addEventListener('click', () => highlightGroup(highlighted === g ? null : g));
    ul.appendChild(li);
  });
}

// ---------- highlight (glow) ----------
let highlighted = null, autoXray = false;
const glowMats = new Map();   // original material -> glowing clone
const glowing = [];           // [mesh, originalMaterial]
function highlightGroup(g) {
  glowing.forEach(([m, orig]) => { m.material = orig; });
  glowing.length = 0;
  highlighted = g;
  document.querySelectorAll('#groups .gname').forEach((b) => b.setAttribute('aria-pressed', String(b.textContent === g)));
  if (g) {
    const cb = [...document.querySelectorAll('#groups li')].find((li) => li.querySelector('.gname').textContent === g).querySelector('input');
    if (!cb.checked) { cb.checked = true; groups.get(g).forEach((o) => { o.visible = true; }); }
    groups.get(g).forEach((node) => node.traverse((m) => {
      if (!m.isMesh) return;
      let gm = glowMats.get(m.material);
      if (!gm) {
        gm = m.material.clone();
        gm.emissive = new THREE.Color(0x2b8cff);
        gm.transparent = false; gm.opacity = 1; gm.depthWrite = true;
        glowMats.set(m.material, gm);
      }
      glowing.push([m, m.material]); m.material = gm;
    }));
    if (!xrayOn) { setXray(true); autoXray = true; }   // internals sit behind the covers
  } else if (autoXray) { setXray(false); autoXray = false; }
}
function pulseGlow(t) {
  const k = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.6 : 0.45 + 0.35 * Math.sin(t * 3.2);
  glowMats.forEach((m) => { m.emissiveIntensity = k; });
}

// ---------- open / close sequence ----------
// Manual 5.4 interlock, reversed for opening.
// Open : ① Pin OUT  — Air Cylinder for Pin IN/OUT (MY3B40-300) pulls pin 04A-09-001 300 mm rearward
//        ② Cover UP — Air Cylinder for Cover UP/DOWN (TCDA2B40 ×2, stroke 500) raises the cover 500 mm
// Close: ② Cover DOWN first, then ① Pin IN.
const SLIDE_STROKE = 0.3, LIFT_STROKE = 0.5;               // m
const SLIDE_SEC = 2.0, LIFT_SEC = 3.0;
const liftMovers = [], slideMovers = [];
const seq = { slide: 0, lift: 0, open: false };
function mover(n, worldDelta) {
  const w0 = n.getWorldPosition(new THREE.Vector3());
  return { n, p0: n.position.clone(), p1: n.parent.worldToLocal(w0.add(worldDelta)) };
}
function setupLift(root) {
  root.traverse((n) => {
    const m = n.userData && n.userData.move;
    if (m === 'lift') liftMovers.push(mover(n, new THREE.Vector3(0, LIFT_STROKE, 0)));
    else if (m === 'slide') slideMovers.push(mover(n, new THREE.Vector3(0, 0, -SLIDE_STROKE)));   // toward the rear
  });
}
const ease = (k) => k * k * (3 - 2 * k);
function applySeq() {
  const ks = ease(seq.slide), kl = ease(seq.lift);
  slideMovers.forEach(({ n, p0, p1 }) => n.position.lerpVectors(p0, p1, ks));
  liftMovers.forEach(({ n, p0, p1 }) => n.position.lerpVectors(p0, p1, kl));
  const mm = document.getElementById('liftmm');
  if (seq.lift > 0) mm.textContent = '커버 상승 ' + Math.round(kl * LIFT_STROKE * 1000) + ' mm';
  else if (seq.slide > 0) mm.textContent = '핀 인출 ' + Math.round(ks * SLIDE_STROKE * 1000) + ' mm';
  else mm.textContent = '닫힘';
}
function stepSeq(dt) {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ds = reduce ? 1 : dt / SLIDE_SEC, dl = reduce ? 1 : dt / LIFT_SEC;
  const before = seq.slide + seq.lift;
  if (seq.open) {
    if (seq.slide < 1) seq.slide = Math.min(1, seq.slide + ds);          // ① block out
    else if (seq.lift < 1) seq.lift = Math.min(1, seq.lift + dl);        // ② then lift
  } else {
    if (seq.lift > 0) seq.lift = Math.max(0, seq.lift - dl);             // ② lower first
    else if (seq.slide > 0) seq.slide = Math.max(0, seq.slide - ds);     // ① then block in
  }
  if (seq.slide + seq.lift !== before) applySeq();
}
function setOpen(open) {
  seq.open = open;
  const b = document.getElementById('lift');
  b.setAttribute('aria-pressed', String(open));
  b.firstChild.textContent = open ? '커버 닫기 ' : '커버 열기 ';
}
document.getElementById('lift').addEventListener('click', () => setOpen(!seq.open));

// ---------- motion playback: ① cover transparent → ② cover open → ③ cover close ----------
const motion = { phase: null, t: 0, xrayBefore: false };
const playBtn = document.getElementById('play');
function startMotion() {
  motion.xrayBefore = xrayOn; motion.phase = 'xray'; motion.t = 0;
  autoXray = false; setXray(true);
  playBtn.setAttribute('aria-pressed', 'true'); playBtn.textContent = '정지';
  document.getElementById('lift').disabled = true;
}
function stopMotion(finished) {
  motion.phase = null;
  playBtn.setAttribute('aria-pressed', 'false'); playBtn.textContent = '모션 재생';
  document.getElementById('lift').disabled = false;
  if (finished && !motion.xrayBefore) setXray(false);
}
playBtn.addEventListener('click', () => (motion.phase ? stopMotion(false) : startMotion()));
function stepMotion(dt) {
  if (!motion.phase) return;
  motion.t += dt;
  if (motion.phase === 'xray' && motion.t > 1.0) { setOpen(true); motion.phase = 'open'; motion.t = 0; }
  else if (motion.phase === 'open' && seq.slide === 1 && seq.lift === 1) { motion.phase = 'hold'; motion.t = 0; }
  else if (motion.phase === 'hold' && motion.t > 1.5) { setOpen(false); motion.phase = 'close'; motion.t = 0; }
  else if (motion.phase === 'close' && seq.slide === 0 && seq.lift === 0) { motion.phase = 'end'; motion.t = 0; }
  else if (motion.phase === 'end' && motion.t > 0.8) stopMotion(true);
}

// ---------- views ----------
const VIEWS = {
  iso:   [1.0, 0.62, 1.15],
  front: [0, 0.18, 1],
  side:  [1, 0.18, 0],
  back:  [-0.35, 0.3, -1],
  top:   [0.0001, 1, 0.0002],
};
let anim = null;
function setView(name, smooth = true) {
  const dir = new THREE.Vector3(...VIEWS[name]).normalize();
  const fov = THREE.MathUtils.degToRad(camera.fov);
  const dist = radius / Math.sin(fov / 2) * (camera.aspect < 1 ? 1.35 / camera.aspect : 1.05);
  const toPos = center.clone().addScaledVector(dir, dist);
  const toTarget = center.clone();
  document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === name)));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!smooth || reduce) { camera.position.copy(toPos); controls.target.copy(toTarget); controls.update(); return; }
  anim = { t: 0, p0: camera.position.clone(), t0: controls.target.clone(), p1: toPos, t1: toTarget };
}
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));

document.getElementById('spin').addEventListener('click', (e) => {
  controls.autoRotate = !controls.autoRotate;
  e.currentTarget.setAttribute('aria-pressed', String(controls.autoRotate));
});
let xrayOn = false;
function setXray(on) {
  xrayOn = on;
  document.getElementById('xray').setAttribute('aria-pressed', String(on));
  coverMats.forEach((m) => { m.transparent = on; m.opacity = on ? 0.14 : 1; m.depthWrite = !on; m.needsUpdate = true; });
}
document.getElementById('xray').addEventListener('click', () => { autoXray = false; setXray(!xrayOn); });

// ---------- loop ----------
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (anim) {
    anim.t = Math.min(1, anim.t + dt / 0.7);
    const k = 1 - Math.pow(1 - anim.t, 3);
    camera.position.lerpVectors(anim.p0, anim.p1, k);
    controls.target.lerpVectors(anim.t0, anim.t1, k);
    if (anim.t >= 1) anim = null;
  }
  stepMotion(dt);
  stepSeq(dt);
  if (glowing.length) pulseGlow(clock.elapsedTime);
  controls.update();
  renderer.render(scene, camera);
});
controls.addEventListener('start', () => { anim = null; document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', 'false')); });
</script>
</body>
